[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edutictac-community"
version = "0.1.2"
description = "Núcleo compartido para los microservicios del Commons EduTicTac"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "authlib>=1.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "uvicorn[standard]>=0.30",
    "pytest>=8",
]

[tool.setuptools]
packages = ["edutictac_community"]
